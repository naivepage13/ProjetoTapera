<main class="container py-5 mt-1">
    <h2 class="mb-4 text-primary">
        <i class="bi bi-chat-dots-fill"></i> Fórum Comunitário
    </h2>

    <!-- FORMULÁRIO CRIAR TÓPICO -->
    <div class="card p-4 mb-5 shadow-sm">
        <h5>Criar Novo Tópico</h5>
        <form id="formTopico">

            <div class="mb-3">
                <label>Título do Tópico</label>
                <input type="text" id="tituloTopico" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mensagem</label>
                <textarea id="conteudoTopico" class="form-control" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-pencil-square"></i> Publicar Tópico
            </button>

        </form>
    </div>

    <!-- LISTA DE TÓPICOS -->
    <h5>Tópicos Publicados</h5>
    <div id="listaTopicos"></div>

</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="meuToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body fw-bold" id="toastMensagem">
                </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const STORAGE_TOPICOS = "topicosForum";
const form = document.getElementById("formTopico");
const listaTopicos = document.getElementById("listaTopicos");

// Simulação de quem está logado no momento
const MEU_USUARIO = "usuario_local_123"; 

function carregarTopicos() {
    const topicos = JSON.parse(localStorage.getItem(STORAGE_TOPICOS)) || [];
    listaTopicos.innerHTML = "";

    if (topicos.length === 0) {
        listaTopicos.innerHTML = "<p class='text-muted'>Nenhum tópico ainda.</p>";
        return;
    }

    topicos.slice().reverse().forEach((topico) => {
        const usuariosLike = topico.usuariosLike || [];
        const usuariosDeslike = topico.usuariosDeslike || [];

        // O total de likes é o tamanho da lista
        const totalLikes = usuariosLike.length;
        const totalDeslikes = usuariosDeslike.length;

        // Verifica se O MEU USUÁRIO está dentro da lista de quem curtiu/descurtiu
        const euCurti = usuariosLike.includes(MEU_USUARIO);
        const euDescurti = usuariosDeslike.includes(MEU_USUARIO);

        // Se eu curti, o botão fica preenchido e verde forte. Se não, fica vazado.
        const iconeLike = euCurti ? "bi-hand-thumbs-up-fill" : "bi-hand-thumbs-up";
        const btnClassLike = euCurti ? "btn-success" : "btn-outline-success";

        // Mesma lógica para o deslike
        const iconeDeslike = euDescurti ? "bi-hand-thumbs-down-fill" : "bi-hand-thumbs-down";
        const btnClassDeslike = euDescurti ? "btn-danger" : "btn-outline-danger";

        const div = document.createElement("div");
        div.className = "card mb-3 shadow-sm";

        div.innerHTML = `
        <div class="card-body">
            <h5>${topico.titulo}</h5>
            <p>${topico.conteudo}</p>
            <small class="text-muted">Publicado em: ${topico.data}</small>
            <hr>
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button class="btn btn-sm ${btnClassLike} btn-like" data-id="${topico.id}">
                        <i class="bi ${iconeLike}"></i> ${totalLikes}
                    </button>
                    <button class="btn btn-sm ${btnClassDeslike} btn-deslike ms-2" data-id="${topico.id}">
                        <i class="bi ${iconeDeslike}"></i> ${totalDeslikes}
                    </button>
                </div>
                <button class="btn btn-sm btn-outline-secondary btn-excluir" data-id="${topico.id}">
                    <i class="bi bi-trash"></i> Excluir
                </button>
            </div>
        </div>
        `;

        listaTopicos.appendChild(div);
    });
}

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const titulo = document.getElementById("tituloTopico").value.trim();
    const conteudo = document.getElementById("conteudoTopico").value.trim();

    if (!titulo || !conteudo) {
        alert("Preencha todos os campos.");
        return;
    }

    // O tópico nasce com listas vazias de likes e deslikes
    const novoTopico = {
        id: Date.now(),
        titulo,
        conteudo,
        data: new Date().toLocaleString("pt-BR"),
        usuariosLike: [],
        usuariosDeslike: []
    };

    let topicos = JSON.parse(localStorage.getItem(STORAGE_TOPICOS)) || [];
    topicos.push(novoTopico);
    localStorage.setItem(STORAGE_TOPICOS, JSON.stringify(topicos));

    mostrarToast("Tópico publicado com sucesso!", "success");

    form.reset();
    carregarTopicos();
});

listaTopicos.addEventListener("click", function(e) {
    const btnExcluir = e.target.closest(".btn-excluir");
    const btnLike = e.target.closest(".btn-like");
    const btnDeslike = e.target.closest(".btn-deslike");

    let topicos = JSON.parse(localStorage.getItem(STORAGE_TOPICOS)) || [];

    // --- LÓGICA DE EXCLUIR ---
    if (btnExcluir) {
        const temCerteza = confirm("Tem certeza que deseja excluir este tópico? Esta ação não pode ser desfeita.");
        
        if (!temCerteza) return;

        const id = Number(btnExcluir.dataset.id);
        let topicos = JSON.parse(localStorage.getItem(STORAGE_TOPICOS)) || [];
        topicos = topicos.filter(t => t.id !== id);
        localStorage.setItem(STORAGE_TOPICOS, JSON.stringify(topicos));
        carregarTopicos();

        mostrarToast("Tópico excluído com sucesso!", "danger");
    }

    // --- LÓGICA DE LIKE ---
    if (btnLike) {
        const id = Number(btnLike.dataset.id);
        const index = topicos.findIndex(t => t.id === id);
        
        if (index !== -1) {
            let topico = topicos[index];
            topico.usuariosLike = topico.usuariosLike || [];
            topico.usuariosDeslike = topico.usuariosDeslike || [];

            if (topico.usuariosLike.includes(MEU_USUARIO)) {
                // Se já tinha dado like, tira o like (remove da lista)
                topico.usuariosLike = topico.usuariosLike.filter(user => user !== MEU_USUARIO);
            } else {
                // Se não tinha dado like, adiciona o like E tira o deslike (se houver)
                topico.usuariosLike.push(MEU_USUARIO);
                topico.usuariosDeslike = topico.usuariosDeslike.filter(user => user !== MEU_USUARIO);
            }

            localStorage.setItem(STORAGE_TOPICOS, JSON.stringify(topicos));
            carregarTopicos();
        }
    }

    // --- LÓGICA DE DESLIKE ---
    if (btnDeslike) {
        const id = Number(btnDeslike.dataset.id);
        const index = topicos.findIndex(t => t.id === id);
        
        if (index !== -1) {
            let topico = topicos[index];
            topico.usuariosLike = topico.usuariosLike || [];
            topico.usuariosDeslike = topico.usuariosDeslike || [];

            if (topico.usuariosDeslike.includes(MEU_USUARIO)) {
                // Se já tinha dado deslike, tira o deslike
                topico.usuariosDeslike = topico.usuariosDeslike.filter(user => user !== MEU_USUARIO);
            } else {
                // Se não tinha dado deslike, adiciona o deslike E tira o like
                topico.usuariosDeslike.push(MEU_USUARIO);
                topico.usuariosLike = topico.usuariosLike.filter(user => user !== MEU_USUARIO);
            }

            localStorage.setItem(STORAGE_TOPICOS, JSON.stringify(topicos));
            carregarTopicos();
        }
    }
});

// ----- FUNÇÃO PARA MOSTRAR O TOAST -----
function mostrarToast(mensagem, tipo = 'success') {
    const toastEl = document.getElementById('meuToast');
    const toastMensagem = document.getElementById('toastMensagem');

    // Remove cores antigas para não acumular
    toastEl.classList.remove('text-bg-success', 'text-bg-warning', 'text-bg-danger', 'text-bg-info', 'text-white');
    
    // Adiciona a nova cor baseada no 'tipo' passado
    toastEl.classList.add(`text-bg-${tipo}`);
    
    // Se for warning (amarelo), o texto fica escuro. Senão, fica branco.
    if(tipo !== 'warning' && tipo !== 'light') {
        toastEl.classList.add('text-white');
    }

    // Coloca a mensagem dentro do Toast
    toastMensagem.textContent = mensagem;

    // Dispara o Toast usando o Bootstrap
    const toast = new bootstrap.Toast(toastEl, {
        delay: 1700 
    });
    toast.show();
}

// Inicia a página
document.addEventListener("DOMContentLoaded", carregarTopicos);
</script>
