# ──────────────────────────────────────────
#  Tapera API — configurações
# ──────────────────────────────────────────

server.port=3000

# Diretório onde os arquivos JSON serão salvos (relativo ao JAR)
tapera.db.dir=./dados

# Segredo JWT (troque em produção por uma variável de ambiente)
tapera.jwt.secret=tapera-secret-java-2026
tapera.jwt.expiration-days=7

# Desabilita o banner padrão do Spring (opcional)
spring.main.banner-mode=off

# Log mais limpo
logging.level.br.com.tapera=INFO
logging.pattern.console=%d{HH:mm:ss} [%5level] %logger{36} - %msg%n
